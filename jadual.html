<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jadual — Kelas Mengaji</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap');

:root{
  --bg:#f0ede8;--card:#fff;--border:#e2ddd6;
  --hijau:#2d6a4f;--hijau-lg:#52b788;--hijau-lt:#d8f3dc;
  --emas:#b5830a;--emas-lt:#fef3c7;
  --merah:#c0392b;--merah-lt:#fdecea;
  --ungu:#6d3a9c;--ungu-lt:#ede9fe;
  --biru:#1a56a0;--biru-lt:#dbeafe;
  --text:#1c1a17;--muted:#7a6e62;
  --shadow:0 2px 14px rgba(0,0,0,0.07);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;padding-top:68px}

.header{background:linear-gradient(135deg,var(--hijau) 0%,#1b4332 100%);padding:13px 16px;position:fixed;top:0;left:0;right:0;z-index:200;box-shadow:0 4px 20px rgba(45,106,79,0.4)}
.hdr{display:flex;align-items:center;gap:11px}
.hdr-back{width:36px;height:36px;background:rgba(255,255,255,0.13);border:1.5px solid rgba(255,255,255,0.2);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;cursor:pointer;color:#fff;text-decoration:none}
.hdr-text h1{font-size:16px;font-weight:900;color:#fff}
.hdr-text p{font-size:10px;color:rgba(255,255,255,0.55);font-family:'JetBrains Mono',monospace;margin-top:1px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.hdr-date{font-size:10px;color:rgba(255,255,255,0.65);font-family:'JetBrains Mono',monospace;text-align:right;line-height:1.7}

.page{padding:13px}

.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}
.card-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:13px}

label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;margin-top:12px}
label:first-child{margin-top:0}
input,select{width:100%;background:var(--bg);border:2px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--text);font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;outline:none;transition:border-color .2s;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--hijau);background:#fff}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 18px;border-radius:12px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;border:none;transition:all .15s;width:100%;margin-top:11px}
.btn:active{transform:scale(.96)}
.btn-hijau{background:var(--hijau);color:#fff;box-shadow:0 4px 14px rgba(45,106,79,.3)}
.btn-merah{background:var(--merah);color:#fff;box-shadow:0 4px 14px rgba(192,57,43,.25)}
.btn-wa{background:#25d366;color:#fff;box-shadow:0 4px 14px rgba(37,211,102,.3)}
.btn-outline{background:transparent;border:2px solid var(--border);color:var(--muted);margin-top:8px}
.btn-sm{padding:9px 14px;font-size:12px;width:auto;margin-top:0}

/* HARI TABS */
.hari-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:14px}
.hari-tabs::-webkit-scrollbar{display:none}
.hari-tab{flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;border:2px solid var(--border);background:var(--card);color:var(--muted);transition:all .2s;font-family:'Nunito',sans-serif}
.hari-tab.active{background:var(--hijau);color:#fff;border-color:var(--hijau)}

/* JADUAL ITEM */
.jadual-item{background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:12px 13px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.jadual-av{width:38px;height:38px;border-radius:11px;background:var(--hijau-lt);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.jadual-info{flex:1;min-width:0}
.jadual-nama{font-size:13px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jadual-sub{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.jadual-masa{font-size:12px;font-weight:800;color:var(--hijau);font-family:'JetBrains Mono',monospace;flex-shrink:0}
.jadual-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{width:32px;height:32px;border-radius:9px;border:1.5px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:all .15s}
.icon-btn:active{transform:scale(.9)}
.icon-btn.del{border-color:var(--merah);background:var(--merah-lt)}

/* REMINDER LIST */
.reminder-item{background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:12px 13px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.reminder-av{width:38px;height:38px;border-radius:11px;background:var(--hijau-lt);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.reminder-info{flex:1;min-width:0}
.reminder-nama{font-size:13px;font-weight:800}
.reminder-sub{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.reminder-btn{flex-shrink:0}

.empty{text-align:center;padding:26px 16px;color:var(--muted)}
.empty-ico{font-size:42px;margin-bottom:9px;opacity:.35}
.empty p{font-size:12px;font-weight:600;line-height:1.7}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.overlay.show{display:flex}
.spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay-msg{color:#fff;font-size:13px;font-weight:700}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--hijau);color:#fff;padding:10px 22px;border-radius:22px;font-size:12px;font-weight:800;z-index:999;transition:transform .3s;white-space:nowrap;box-shadow:0 6px 24px rgba(45,106,79,.4)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--merah)}
.toast.warn{background:var(--emas)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:none;align-items:flex-end}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px 32px;width:100%;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-size:14px;font-weight:900;margin-bottom:16px;text-align:center}

/* SECTION LABEL */
.seksyen-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:14px 0 8px;padding-left:2px}

/* COUNT BADGE */
.count-badge{display:inline-flex;align-items:center;justify-content:center;background:var(--hijau);color:#fff;font-size:10px;font-weight:800;border-radius:20px;padding:2px 8px;margin-left:6px;font-family:'JetBrains Mono',monospace}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="hdr">
    <a href="index.html" class="hdr-back">←</a>
    <div class="hdr-text"><h1>Jadual</h1><p>Kelas &amp; Reminder</p></div>
    <div class="hdr-right">
      <div class="hdr-date" id="hdrDate"></div>
    </div>
  </div>
</div>

<div class="page">

  <!-- HARI FILTER -->
  <div class="hari-tabs" id="hariTabs">
    <button class="hari-tab active" onclick="tunjukHari('Ahad')"    id="ht-Ahad">Ahad</button>
    <button class="hari-tab"        onclick="tunjukHari('Isnin')"   id="ht-Isnin">Isnin</button>
    <button class="hari-tab"        onclick="tunjukHari('Selasa')"  id="ht-Selasa">Selasa</button>
    <button class="hari-tab"        onclick="tunjukHari('Rabu')"    id="ht-Rabu">Rabu</button>
    <button class="hari-tab"        onclick="tunjukHari('Khamis')"  id="ht-Khamis">Khamis</button>
    <button class="hari-tab"        onclick="tunjukHari('Jumaat')"  id="ht-Jumaat">Jumaat</button>
    <button class="hari-tab"        onclick="tunjukHari('Sabtu')"   id="ht-Sabtu">Sabtu</button>
  </div>

  <!-- SENARAI JADUAL -->
  <div class="card">
    <div class="card-title">
      📅 Jadual <span id="hariAktif"></span>
      <span class="count-badge" id="countBadge">0</span>
    </div>
    <div id="senarai-jadual"></div>
    <button class="btn btn-outline" onclick="bukaModalTambah()">＋ Tambah Pelajar</button>
  </div>

  <!-- REMINDER HARI INI -->
  <div class="card" id="card-reminder" style="display:none">
    <div class="card-title">
      📲 Reminder Hari Ini
      <span class="count-badge" id="reminderCount">0</span>
    </div>
    <div id="senarai-reminder"></div>
    <button class="btn btn-wa" onclick="blastSemuaReminder()">📲 Blast Semua WhatsApp</button>
  </div>

</div>

<!-- MODAL TAMBAH -->
<div class="modal-bg" id="modalBg" onclick="tutupModal(event)">
  <div class="modal">
    <div class="modal-title">➕ Tambah ke Jadual</div>
    <label>Pilih Pelajar</label>
    <input type="text" id="m-cari" placeholder="🔍 Cari nama..." oninput="filterModalPelajar()" autocomplete="off" style="margin-bottom:6px">
    <select id="m-pelajar"><option value="">-- Pilih Pelajar --</option></select>
    <label>Hari</label>
    <select id="m-hari">
      <option value="Ahad">Ahad</option>
      <option value="Isnin">Isnin</option>
      <option value="Selasa">Selasa</option>
      <option value="Rabu">Rabu</option>
      <option value="Khamis">Khamis</option>
      <option value="Jumaat">Jumaat</option>
      <option value="Sabtu">Sabtu</option>
    </select>
    <label>Masa</label>
    <input type="time" id="m-masa">
    <button class="btn btn-hijau" onclick="simpanJadual()">💾 Simpan</button>
    <button class="btn btn-outline" onclick="tutupModalBtn()">Batal</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="spinner"></div>
  <div class="overlay-msg" id="overlay-msg">Menyimpan...</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════
   CONFIG & CACHE
════════════════════════════════ */
const DB_NAME='mgj_db', DB_VER=5
let _db=null
let CACHE={keluarga:[],pelajar:[]}
let JADUAL=[]   // [{uid, pelajarUid, hari, masa}]
let hariAktif='Ahad'

const HARI_LIST=['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu']

/* ════════════════════════════════
   INDEXEDDB
════════════════════════════════ */
function openDB(){
  if(_db) return Promise.resolve(_db)
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,DB_VER)
    req.onupgradeneeded=e=>{
      const db=e.target.result
      if(!db.objectStoreNames.contains('keluarga'))     db.createObjectStore('keluarga',{keyPath:'uid'})
      if(!db.objectStoreNames.contains('pelajar'))      db.createObjectStore('pelajar',{keyPath:'uid'})
      if(!db.objectStoreNames.contains('rekod')){
        const s=db.createObjectStore('rekod',{keyPath:'uid'})
        s.createIndex('pelajarTarikh','_pt',{unique:true})
        s.createIndex('tarikh','tarikh')
      }
      if(!db.objectStoreNames.contains('meta'))          db.createObjectStore('meta',{keyPath:'k'})
      if(!db.objectStoreNames.contains('uid_log'))       db.createObjectStore('uid_log',{keyPath:'uid'})
      if(!db.objectStoreNames.contains('tombstone'))     db.createObjectStore('tombstone',{keyPath:'uid'})
      if(!db.objectStoreNames.contains('wallet'))        db.createObjectStore('wallet',{keyPath:'keluargaUid'})
      if(!db.objectStoreNames.contains('bayaran_rekod')) db.createObjectStore('bayaran_rekod',{keyPath:'uid'})
      if(!db.objectStoreNames.contains('jadual'))        db.createObjectStore('jadual',{keyPath:'uid'})
    }
    req.onsuccess=e=>{ _db=e.target.result; res(_db) }
    req.onerror=e=>rej(e.target.error)
  })
}

function dbGet(store,key){ return openDB().then(db=>new Promise((res,rej)=>{ const r=db.transaction(store,'readonly').objectStore(store).get(key); r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e.target.error) })) }
function dbGetAll(store){ return openDB().then(db=>new Promise((res,rej)=>{ const r=db.transaction(store,'readonly').objectStore(store).getAll(); r.onsuccess=e=>res(e.target.result||[]); r.onerror=e=>rej(e.target.error) })) }
function dbPut(store,obj){ return openDB().then(db=>new Promise((res,rej)=>{ const r=db.transaction(store,'readwrite').objectStore(store).put(obj); r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e.target.error) })) }
function dbDelete(store,key){ return openDB().then(db=>new Promise((res,rej)=>{ const r=db.transaction(store,'readwrite').objectStore(store).delete(key); r.onsuccess=e=>res(); r.onerror=e=>rej(e.target.error) })) }

/* ════════════════════════════════
   HELPERS
════════════════════════════════ */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7) }

function fmtMasa(t){
  if(!t) return ''
  const[h,m]=t.split(':')
  const hr=+h
  const label=hr<12?'pagi':hr<18?'petang':'malam'
  const h12=hr===0?12:hr>12?hr-12:hr
  return h12+':'+(m||'00')+' '+label
}

function toast(msg,type=''){
  const t=document.getElementById('toast')
  t.textContent=msg; t.className='toast show'+(type?' '+type:'')
  clearTimeout(window._tt)
  window._tt=setTimeout(()=>t.className='toast',2800)
}
function showOverlay(msg='Menyimpan...'){ document.getElementById('overlay-msg').textContent=msg; document.getElementById('overlay').classList.add('show') }
function hideOverlay(){ document.getElementById('overlay').classList.remove('show') }

/* ════════════════════════════════
   CONFIG
════════════════════════════════ */
function getScriptURL(){
  const param=new URLSearchParams(window.location.search).get('url')
  if(param){ localStorage.setItem('mgj_url',param); return param }
  return localStorage.getItem('mgj_url')||''
}
let SCRIPT_URL=getScriptURL()

async function api(body){
  if(!SCRIPT_URL) throw new Error('No URL')
  const resp=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(body)})
  const data=await resp.json()
  if(!data.ok) throw new Error(data.msg||'Ralat')
  return data
}

/* ════════════════════════════════
   LOAD DATA
════════════════════════════════ */
async function loadData(){
  // Load dari IDB dulu — serta-merta
  const[k,p,j]=await Promise.all([dbGetAll('keluarga'),dbGetAll('pelajar'),dbGetAll('jadual')])
  CACHE.keluarga=k; CACHE.pelajar=p; JADUAL=j
  populateModalPelajar()

  // Kalau IDB kosong, sync dari Sheets
  if((!k.length||!p.length) && SCRIPT_URL){
    showOverlay('Memuatkan data...')
    try{
      const[rK,rP]=await Promise.all([api({action:'getKeluarga'}),api({action:'getPelajar'})])
      const keluarga=rK.data||[]; const pelajar=rP.data||[]
      await Promise.all([
        ...keluarga.map(x=>dbPut('keluarga',x)),
        ...pelajar.map(x=>dbPut('pelajar',x))
      ])
      CACHE.keluarga=keluarga; CACHE.pelajar=pelajar
      populateModalPelajar()
    }catch(e){ toast('Gagal load data dari server','err') }
    finally{ hideOverlay() }
  }
}

/* ════════════════════════════════
   HARI TABS
════════════════════════════════ */
function tunjukHari(hari){
  hariAktif=hari
  HARI_LIST.forEach(h=>{
    const btn=document.getElementById('ht-'+h)
    if(btn) btn.className='hari-tab'+(h===hari?' active':'')
  })
  document.getElementById('hariAktif').textContent=hari
  renderJadual()
  renderReminder()
}

/* ════════════════════════════════
   RENDER JADUAL
════════════════════════════════ */
function renderJadual(){
  const list=JADUAL.filter(j=>j.hari===hariAktif).sort((a,b)=>a.masa.localeCompare(b.masa))
  document.getElementById('countBadge').textContent=list.length
  const el=document.getElementById('senarai-jadual')
  if(!list.length){
    el.innerHTML='<div class="empty"><div class="empty-ico">📅</div><p>Tiada pelajar dijadualkan<br>pada hari '+hariAktif+'</p></div>'
    return
  }
  el.innerHTML=list.map(j=>{
    const p=CACHE.pelajar.find(x=>x.uid===j.pelajarUid)
    const k=p?CACHE.keluarga.find(x=>x.uid===p.keluargaUid):null
    const nama=p?p.nama:'Pelajar tidak dijumpai'
    const fam=k?k.nama:''
    const inisial=nama.charAt(0).toUpperCase()
    return `<div class="jadual-item">
      <div class="jadual-av">${inisial}</div>
      <div class="jadual-info">
        <div class="jadual-nama">${nama}</div>
        <div class="jadual-sub">${fam}</div>
      </div>
      <div class="jadual-masa">${fmtMasa(j.masa)}</div>
      <div class="jadual-actions">
        <div class="icon-btn del" onclick="hapusJadual('${j.uid}')">🗑️</div>
      </div>
    </div>`
  }).join('')
}

/* ════════════════════════════════
   RENDER REMINDER HARI INI
════════════════════════════════ */
function renderReminder(){
  const hariIni=HARI_LIST[new Date().getDay()]
  const cardReminder=document.getElementById('card-reminder')

  // Tunjuk card reminder hanya untuk hari ini
  if(hariAktif!==hariIni){ cardReminder.style.display='none'; return }

  const list=JADUAL.filter(j=>j.hari===hariAktif).sort((a,b)=>a.masa.localeCompare(b.masa))
  if(!list.length){ cardReminder.style.display='none'; return }

  cardReminder.style.display='block'
  document.getElementById('reminderCount').textContent=list.length

  const el=document.getElementById('senarai-reminder')
  el.innerHTML=list.map(j=>{
    const p=CACHE.pelajar.find(x=>x.uid===j.pelajarUid)
    const k=p?CACHE.keluarga.find(x=>x.uid===p.keluargaUid):null
    const nama=p?p.nama:'?'
    const fam=k?k.nama:''
    const tel=k?k.tel:''
    const inisial=nama.charAt(0).toUpperCase()
    return `<div class="reminder-item">
      <div class="reminder-av">${inisial}</div>
      <div class="reminder-info">
        <div class="reminder-nama">${nama}</div>
        <div class="reminder-sub">${fam} · ${fmtMasa(j.masa)}</div>
      </div>
      <div class="reminder-btn">
        <button class="btn btn-wa btn-sm" onclick="hantarReminder('${j.uid}')">📲</button>
      </div>
    </div>`
  }).join('')
}

/* ════════════════════════════════
   WHATSAPP REMINDER
════════════════════════════════ */
function buatMesejReminder(pelajar, keluarga, masa){
  const hariIni=HARI_LIST[new Date().getDay()]
  const now=new Date()
  const bulan=['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember']
  const tarikhFmt=hariIni+', '+now.getDate()+' '+bulan[now.getMonth()]+' '+now.getFullYear()
  return 'Allahumma solli ala Saidina Muhammad \u{1F339}\n\n'+
    'Assalamualaikum w.b.t,\n\n'+
    'Peringatan kelas mengaji *'+pelajar.nama+'* pada hari ini\n'+
    '*'+tarikhFmt+'* jam *'+fmtMasa(masa)+'*.\n\n'+
    'Harap dapat hadir tepat pada masanya. \u{1F64F}'
}

function hantarReminder(jUid){
  const j=JADUAL.find(x=>x.uid===jUid)
  if(!j) return
  const p=CACHE.pelajar.find(x=>x.uid===j.pelajarUid)
  const k=p?CACHE.keluarga.find(x=>x.uid===p.keluargaUid):null
  if(!k||!k.tel){ toast('Tiada nombor telefon!','err'); return }
  const msg=buatMesejReminder(p,k,j.masa)
  const tel=k.tel.replace(/\D/g,'')
  window.open('https://wa.me/'+(tel.startsWith('0')?'6'+tel:tel)+'?text='+encodeURIComponent(msg),'_blank')
}

async function blastSemuaReminder(){
  const hariIni=HARI_LIST[new Date().getDay()]
  const list=JADUAL.filter(j=>j.hari===hariIni).sort((a,b)=>a.masa.localeCompare(b.masa))
  if(!list.length){ toast('Tiada jadual hari ini!','warn'); return }

  // Bina senarai link
  const senarai=list.map(j=>{
    const p=CACHE.pelajar.find(x=>x.uid===j.pelajarUid)
    const k=p?CACHE.keluarga.find(x=>x.uid===p.keluargaUid):null
    if(!p||!k||!k.tel) return null
    const msg=buatMesejReminder(p,k,j.masa)
    const tel=k.tel.replace(/\D/g,'')
    const url='https://wa.me/'+(tel.startsWith('0')?'6'+tel:tel)+'?text='+encodeURIComponent(msg)
    return {nama:p.nama, fam:k.nama, masa:j.masa, url}
  }).filter(Boolean)

  if(!senarai.length){ toast('Tiada nombor telefon ditemui!','err'); return }

  // Replace reminder list dengan blast UI
  const el=document.getElementById('senarai-reminder')
  el.innerHTML=`
    <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:10px;line-height:1.6">
      Tekan butang WA untuk hantar reminder satu persatu. Setiap butang akan buka WhatsApp.
    </div>
    ${senarai.map((s,i)=>`
    <div class="reminder-item">
      <div class="reminder-av">${s.nama.charAt(0).toUpperCase()}</div>
      <div class="reminder-info">
        <div class="reminder-nama">${s.nama}</div>
        <div class="reminder-sub">${s.fam} · ${fmtMasa(s.masa)}</div>
      </div>
      <div class="reminder-btn">
        <a href="${s.url}" target="_blank" class="btn btn-wa btn-sm" style="text-decoration:none;display:inline-flex">
          📲 Hantar
        </a>
      </div>
    </div>`).join('')}
    <button class="btn btn-outline" onclick="renderReminder()" style="margin-top:4px">↩ Semula</button>
  `
  // Sembunyikan blast button
  document.querySelector('#card-reminder .btn-wa:last-of-type') && 
    document.querySelector('#card-reminder > .btn-wa') && 
    (document.querySelector('#card-reminder > .btn-wa').style.display='none')
}

/* ════════════════════════════════
   MODAL TAMBAH
════════════════════════════════ */
function populateModalPelajar(cari=''){
  const sel=document.getElementById('m-pelajar')
  const cur=sel.value
  const filtered=cari
    ? CACHE.pelajar.filter(p=>{
        const k=CACHE.keluarga.find(x=>x.uid===p.keluargaUid)
        return p.nama.toLowerCase().includes(cari)||(k&&k.nama.toLowerCase().includes(cari))
      })
    : CACHE.pelajar
  sel.innerHTML='<option value="">-- Pilih Pelajar --</option>'+filtered.map(p=>{
    const k=CACHE.keluarga.find(x=>x.uid===p.keluargaUid)
    return '<option value="'+p.uid+'">'+(k?p.nama+' ('+k.nama+')':p.nama)+'</option>'
  }).join('')
  if(cur) sel.value=cur
}

function filterModalPelajar(){
  populateModalPelajar(document.getElementById('m-cari').value.toLowerCase().trim())
}

function bukaModalTambah(){
  document.getElementById('m-hari').value=hariAktif
  document.getElementById('m-masa').value='20:00'
  document.getElementById('m-cari').value=''
  document.getElementById('m-pelajar').value=''
  populateModalPelajar()
  document.getElementById('modalBg').classList.add('show')
}

function tutupModal(e){
  if(e.target===document.getElementById('modalBg')) tutupModalBtn()
}
function tutupModalBtn(){ document.getElementById('modalBg').classList.remove('show') }

async function simpanJadual(){
  const pUid=document.getElementById('m-pelajar').value
  const hari=document.getElementById('m-hari').value
  const masa=document.getElementById('m-masa').value
  if(!pUid){ toast('Sila pilih pelajar!','err'); return }
  if(!masa){ toast('Sila masukkan masa!','err'); return }

  // Semak duplicate
  const ada=JADUAL.find(j=>j.pelajarUid===pUid&&j.hari===hari)
  if(ada){ toast('Pelajar ini dah ada jadual hari '+hari+'!','warn'); return }

  const entry={uid:uid(), pelajarUid:pUid, hari, masa}
  showOverlay('Menyimpan jadual...')
  try{
    await dbPut('jadual',entry)
    JADUAL.push(entry)
    tutupModalBtn()
    // Switch ke hari yang baru ditambah
    tunjukHari(hari)
    hideOverlay()
    toast('✅ Jadual disimpan!')
  }catch(e){ hideOverlay(); toast('❌ Gagal: '+e.message,'err') }
}

async function hapusJadual(jUid){
  if(!confirm('Padam jadual ini?')) return
  showOverlay('Memadam...')
  try{
    await dbDelete('jadual',jUid)
    JADUAL=JADUAL.filter(j=>j.uid!==jUid)
    renderJadual()
    renderReminder()
    hideOverlay()
    toast('🗑️ Jadual dipadam','err')
  }catch(e){ hideOverlay(); toast('❌ Gagal: '+e.message,'err') }
}

/* ════════════════════════════════
   INIT
════════════════════════════════ */
async function init(){
  const now=new Date()
  const hariList=['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu']
  const bulanPendek=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogos','Sep','Okt','Nov','Dis']
  document.getElementById('hdrDate').innerHTML=hariList[now.getDay()]+', '+now.getDate()+' '+bulanPendek[now.getMonth()]+' '+now.getFullYear()

  // Set tab ke hari ini
  const hariIni=hariList[now.getDay()]
  hariAktif=hariIni

  await loadData()
  tunjukHari(hariIni)
}

init()
</script>
